name: Verify school MVP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lostfound-school
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lostfound-school/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node node_modules/@playwright/test/cli.js install --with-deps chrome
      - run: npm run test:e2e
