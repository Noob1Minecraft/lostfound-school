name: Verify school MVP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lostfound-school
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lostfound-school/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build Neon frontend with Vercel Preview metadata and no service credentials
        run: node scripts/build-vercel-preview-fixture.mjs
        env:
          VITE_AUTH_PROVIDER: neon
          VITE_API_URL: /api
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
      - name: Ensure Chrome is available
        timeout-minutes: 5
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            node node_modules/@playwright/test/cli.js install --with-deps chrome
          fi
      - run: npm run test:e2e
      - run: npm run test:e2e:neon
